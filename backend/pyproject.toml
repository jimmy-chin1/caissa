[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "caissa"
dynamic = ["version"]
requires-python = ">= 3.13"
authors = [
  {name = "Jimmy Chin"},
]
maintainers = [
  {name = "Jimmy Chin"}
]
description = "Caissa is an intelligent chess platform for playing, analysing, and improving your game."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*, AUTHORS.md"]
keywords = ["chess", "stockfish", "pgn", "chess-puzzles", "personalized-learning"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Games/Entertainment :: Board Games",
  "Programming Language :: Python"
]

[project.urls]
Repository = "https://github.com/jimmy-chin1/caissa"
"Bug Tracker" = "https://github.com/jimmy-chin1/caissa/issues"
Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[project.scripts]
caissa = "caissa.backend.main:main"

[project.gui-scripts]
caissa = "caissa.backend.main:main"

[project.entry-points."caissa.backend"]
caissa = "caissa:main"
